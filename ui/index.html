<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SnapStudio · 屏幕截图标注工作台</title>
<style>
:root{
  --bg:#070910;
  --panel:rgba(18,22,36,.74);
  --panel-2:rgba(12,15,26,.9);
  --line:rgba(255,255,255,.09);
  --line-2:rgba(255,255,255,.16);
  --txt:#e9edf8;
  --dim:#8890a8;
  --a1:#7c5cff;
  --a2:#22d3ee;
  --a3:#ff3d81;
  --ok:#31d99c;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--txt);
  font:14px/1.55 "PingFang SC","Microsoft YaHei",-apple-system,"Segoe UI",Roboto,sans-serif;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}

/* ---------- 背景氛围 ---------- */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:.42;animation:float 20s ease-in-out infinite}
.orb.a{width:560px;height:560px;background:radial-gradient(circle,#5b3bff,transparent 70%);top:-190px;left:-140px}
.orb.b{width:520px;height:520px;background:radial-gradient(circle,#00d6ff,transparent 70%);bottom:-220px;right:-120px;animation-delay:-7s}
.orb.c{width:400px;height:400px;background:radial-gradient(circle,#ff2f7b,transparent 70%);top:38%;left:52%;animation-delay:-13s}
@keyframes float{
  0%,100%{transform:translate3d(0,0,0) scale(1)}
  33%{transform:translate3d(44px,-34px,0) scale(1.08)}
  66%{transform:translate3d(-34px,28px,0) scale(.94)}
}
.gridbg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(circle at 50% 26%,#000 0%,transparent 76%);
  mask-image:radial-gradient(circle at 50% 26%,#000 0%,transparent 76%);
}

/* ---------- 布局 ---------- */
.app{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:20px 20px 34px;display:flex;flex-direction:column;gap:14px;min-height:100%}

.topbar{
  display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:18px;
  border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(20px);
  box-shadow:0 22px 60px -30px #000;position:relative;overflow:hidden;
}
.topbar::after{
  content:"";position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--a1),var(--a2),transparent);
  opacity:.75;animation:sheen 5s linear infinite;
}
@keyframes sheen{0%{transform:translateX(-40%)}100%{transform:translateX(40%)}}
.logo{
  width:40px;height:40px;flex:0 0 40px;border-radius:13px;
  background:linear-gradient(135deg,var(--a1),var(--a2));
  display:grid;place-items:center;box-shadow:0 10px 26px -10px var(--a1);
}
.brand h1{margin:0;font-size:15.5px;font-weight:650;letter-spacing:.4px;
  background:linear-gradient(90deg,#fff,#b9c4ff 60%,#8ef0ff);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{margin:2px 0 0;font-size:11.5px;color:var(--dim);letter-spacing:.2px}
.spacer{flex:1}
.pill{
  display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:12px;color:var(--dim);
  white-space:nowrap;
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);box-shadow:0 0 0 0 rgba(0,0,0,0)}
.dot.live{background:var(--ok);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(49,217,156,.55)}100%{box-shadow:0 0 0 9px rgba(49,217,156,0)}}

.btn{
  display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;
  font-size:13px;font-weight:600;border:1px solid var(--line);background:rgba(255,255,255,.045);
  transition:transform .16s ease,box-shadow .2s ease,background .2s ease,border-color .2s;
  white-space:nowrap;
}
.btn:hover{transform:translateY(-1.5px);background:rgba(255,255,255,.09);border-color:var(--line-2)}
.btn:active{transform:translateY(0) scale(.985)}
.btn.primary{
  border-color:transparent;color:#fff;
  background:linear-gradient(135deg,var(--a1),#5f8dff 45%,var(--a2));
  box-shadow:0 12px 30px -12px var(--a1),inset 0 1px 0 rgba(255,255,255,.25);
}
.btn.primary:hover{box-shadow:0 18px 40px -14px var(--a1),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

.stage{
  position:relative;border-radius:22px;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(19,23,38,.85),rgba(10,12,21,.94));
  padding:18px;min-height:460px;display:grid;place-items:center;
  box-shadow:0 40px 90px -50px #000,inset 0 1px 0 rgba(255,255,255,.05);
  overflow:hidden;
}
.stage::before{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:radial-gradient(600px 220px at 50% -10%,rgba(124,92,255,.16),transparent 70%);
}

/* ---------- 空状态 ---------- */
.empty{position:relative;text-align:center;padding:34px 22px;max-width:620px}
.empty .halo{
  width:88px;height:88px;margin:0 auto 18px;border-radius:26px;display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(124,92,255,.28),rgba(34,211,238,.22));
  border:1px solid var(--line-2);box-shadow:0 24px 60px -26px var(--a1);
  animation:breathe 4.2s ease-in-out infinite;
}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.04)}}
.empty h2{margin:0 0 8px;font-size:20px;font-weight:650;letter-spacing:.3px}
.empty p{margin:0 0 22px;color:var(--dim);font-size:13px;line-height:1.75}
.empty .acts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.dash{
  margin-top:22px;padding:14px 16px;border-radius:14px;border:1px dashed rgba(255,255,255,.14);
  color:#6f778f;font-size:12px;text-align:left;background:rgba(255,255,255,.018);
}
.dash b{color:#aab3cc;font-weight:600}

/* ---------- 画布台 ---------- */
.boardwrap{display:none;position:relative;line-height:0;border-radius:12px;
  box-shadow:0 30px 80px -32px #000,0 0 0 1px var(--line)}
#displayCanvas{display:block;max-width:100%;max-height:70vh;width:auto;height:auto;border-radius:12px}
#overlay{position:absolute;inset:0;cursor:crosshair;border-radius:12px;touch-action:none}
#annCanvas{position:absolute;display:none;pointer-events:none;image-rendering:auto}

#selBox{
  position:absolute;display:none;pointer-events:none;
  box-shadow:0 0 0 9999px rgba(4,6,14,.66);
  outline:1.5px solid rgba(255,255,255,.92);
  outline-offset:0;border-radius:2px;
}
#selBox::after{
  content:"";position:absolute;inset:-1px;border-radius:3px;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(124,92,255,.5),0 0 22px rgba(124,92,255,.45);
}
.hnd{position:absolute;width:9px;height:9px;border-radius:3px;background:#fff;
  border:1.5px solid var(--a1);box-shadow:0 2px 6px rgba(0,0,0,.5)}
.hnd.tl{left:-5px;top:-5px}.hnd.tr{right:-5px;top:-5px}
.hnd.bl{left:-5px;bottom:-5px}.hnd.br{right:-5px;bottom:-5px}
#sizeBadge{
  position:absolute;top:-28px;left:0;padding:3px 9px;border-radius:8px;font-size:11.5px;
  font-weight:600;letter-spacing:.3px;color:#0a0c14;line-height:1.5;
  background:linear-gradient(135deg,#fff,#c9d6ff);white-space:nowrap;
  box-shadow:0 6px 18px -8px #000;
}
#mag{
  position:absolute;display:none;width:126px;height:126px;border-radius:50%;
  border:2px solid rgba(255,255,255,.85);overflow:hidden;pointer-events:none;z-index:20;
  box-shadow:0 16px 40px -14px #000,0 0 0 4px rgba(124,92,255,.25);
  background:#000;
}
#mag canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
#magTip{
  position:absolute;left:50%;bottom:6px;transform:translateX(-50%);
  padding:1px 6px;border-radius:6px;font-size:10px;color:#0a0c14;font-weight:700;
  background:rgba(255,255,255,.92);white-space:nowrap;
}

/* ---------- 浮动工具条 ---------- */
.toolbar{
  position:absolute;display:none;flex-direction:column;gap:8px;z-index:40;
  padding:9px;border-radius:16px;border:1px solid var(--line-2);
  background:var(--panel-2);backdrop-filter:blur(22px);
  box-shadow:0 30px 70px -26px #000,inset 0 1px 0 rgba(255,255,255,.09);
  animation:pop .2s cubic-bezier(.2,.9,.3,1.4);
  max-width:calc(100vw - 32px);
}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.96)}
  to{opacity:1;transform:translateY(0) scale(1)}}
.trow{display:flex;align-items:center;gap:3px;flex-wrap:wrap;justify-content:center;max-width:520px}
.sep{width:1px;align-self:stretch;margin:2px 5px;background:var(--line)}
.tool{
  width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
  color:#a9b2ca;transition:all .16s ease;position:relative;
}
.tool:hover{background:rgba(255,255,255,.09);color:#fff;transform:translateY(-1.5px)}
.tool.on{
  color:#fff;background:linear-gradient(135deg,var(--a1),#4f8bff 55%,var(--a2));
  box-shadow:0 8px 20px -8px var(--a1),inset 0 1px 0 rgba(255,255,255,.3);
}
.tool svg{width:18px;height:18px;display:block}
.tool[data-tip]:hover::after{
  content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  padding:3px 8px;border-radius:7px;font-size:11px;white-space:nowrap;color:#e9edf8;
  background:rgba(8,10,18,.96);border:1px solid var(--line-2);box-shadow:0 8px 22px -10px #000;z-index:60;
}
.swatches{display:flex;gap:5px;align-items:center;padding:0 4px}
.sw{
  width:19px;height:19px;border-radius:50%;border:2px solid transparent;
  transition:transform .15s ease,box-shadow .15s ease;position:relative;
}
.sw:hover{transform:scale(1.16)}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.22),0 6px 14px -6px #000;transform:scale(1.1)}
.widths{display:flex;gap:2px;align-items:center}
.wbtn{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;transition:background .15s}
.wbtn:hover{background:rgba(255,255,255,.09)}
.wbtn.on{background:rgba(124,92,255,.32)}
.wbtn i{display:block;border-radius:99px;background:currentColor}
.textctl{display:flex;gap:4px;align-items:center}
.fsel,.isize{
  background:rgba(255,255,255,.06);color:var(--txt);border:1px solid var(--line);
  border-radius:8px;font-size:12px;padding:3px 4px;outline:none;cursor:pointer;max-width:88px;
}
.fsel:hover,.isize:hover{border-color:var(--line-2);background:rgba(255,255,255,.1)}
.fbold{
  width:26px;height:26px;border-radius:8px;font-weight:800;font-size:14px;color:#a9b2ca;
  border:1px solid var(--line);transition:all .15s;
}
.fbold:hover{background:rgba(255,255,255,.09);color:#fff}
.fbold.on{background:rgba(124,92,255,.32);color:#fff;border-color:transparent}
/* 取色器吸管吸附工具激活态由 .tool.on 复用 */
/* 标注选中态 */
.annSelTip{position:absolute;display:none;z-index:48;gap:6px;padding:6px;border-radius:10px;
  background:var(--panel-2);border:1px solid var(--line-2);backdrop-filter:blur(16px);box-shadow:0 18px 44px -18px #000}
.annSelTip button{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:#cdd6ee;font-size:12px}
.annSelTip button:hover{background:rgba(255,255,255,.12);color:#fff}
.annSelTip svg{width:15px;height:15px}

/* 文字输入 */
#textInput{
  position:absolute;display:none;z-index:45;padding:2px 6px;border-radius:7px;
  background:rgba(8,10,18,.7);border:1.4px dashed rgba(255,255,255,.8);color:#fff;
  font-weight:700;outline:none;min-width:70px;backdrop-filter:blur(4px);
}

/* ---------- 底部 ---------- */
.hints{
  display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:center;
  padding:12px 16px;border-radius:16px;border:1px solid var(--line);
  background:rgba(14,17,28,.6);backdrop-filter:blur(14px);font-size:12px;color:var(--dim);
}
kbd{
  display:inline-block;padding:1.5px 7px;border-radius:6px;font-size:11px;font-family:ui-monospace,Menlo,Consolas,monospace;
  color:#cdd6ee;background:rgba(255,255,255,.07);border:1px solid var(--line-2);
  box-shadow:0 2px 0 rgba(0,0,0,.4);margin-right:4px;
}
.toast{
  position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(20px);
  padding:11px 20px;border-radius:13px;font-size:13px;font-weight:600;z-index:200;
  background:rgba(10,13,22,.95);border:1px solid var(--line-2);color:#e9edf8;
  box-shadow:0 24px 60px -22px #000;opacity:0;pointer-events:none;transition:all .28s cubic-bezier(.2,.9,.3,1.3);
  backdrop-filter:blur(14px);display:flex;align-items:center;gap:9px;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .bar{width:3px;height:16px;border-radius:2px;background:linear-gradient(180deg,var(--a1),var(--a2))}

/* ---------- 长截图控制条 ---------- */
.longbar{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:210;display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:14px;background:rgba(12,15,24,.96);border:1px solid var(--line-2);box-shadow:0 24px 60px -22px #000;color:#e9edf8;font-size:13px;backdrop-filter:blur(14px)}
.longbar.hidden{display:none}
.longInfo{white-space:nowrap;opacity:.9}
.longBtns{display:flex;gap:8px;pointer-events:auto}
/* 容器不响应指针事件：滚轮/点击穿透到下方的目标窗口，仅按钮可交互 */
.longbar{pointer-events:none}
.lbtn{border:1px solid var(--line-2);background:rgba(255,255,255,.06);color:inherit;padding:6px 12px;border-radius:9px;font-size:13px;cursor:pointer;white-space:nowrap}
.lbtn:hover{background:rgba(255,255,255,.12)}
.lbtn.primary{background:linear-gradient(135deg,var(--a1),var(--a2));border:none;color:#0b0e16;font-weight:650}
.lbtn.ghost{background:transparent;color:var(--dim)}

/* ---------- 智能工具弹窗 ---------- */
.modal{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:rgba(4,6,14,.62);backdrop-filter:blur(6px)}
.modalCard{width:min(520px,92vw);max-height:84vh;overflow:auto;border-radius:18px;border:1px solid var(--line-2);
  background:var(--panel-2);box-shadow:0 40px 90px -30px #000;padding:18px}
.modalHead{display:flex;align-items:center;justify-content:space-between;font-weight:650;font-size:15px;margin-bottom:12px}
.modalHead button{width:30px;height:30px;border-radius:9px;font-size:20px;line-height:1;color:var(--dim);background:rgba(255,255,255,.05)}
.modalHead button:hover{background:rgba(255,255,255,.12);color:#fff}
.modalBody{font-size:13px;color:var(--txt);line-height:1.6}
.modalBody textarea{width:100%;min-height:120px;background:rgba(255,255,255,.05);border:1px solid var(--line);
  border-radius:12px;color:var(--txt);padding:10px;font-family:inherit;font-size:13px;resize:vertical;outline:none}
.modalBody .qrbox{display:grid;place-items:center;padding:10px;background:#fff;border-radius:12px}
.modalFoot{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.sbtn{padding:9px 16px;border-radius:11px;font-size:13px;font-weight:600;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#e9edf8}
.sbtn:hover{background:rgba(255,255,255,.12)}
.sbtn.primary{background:linear-gradient(135deg,var(--a1),#5f8dff 45%,var(--a2));border-color:transparent;color:#fff}
.serr{color:var(--a3)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
@media (max-width:760px){
  .brand p{display:none}
  .hints{font-size:11px}
  #displayCanvas{max-height:52vh}
}

/* ===== Tauri 截屏全屏态 ===== */
body.capturing .app{max-width:none;padding:0;gap:0}
body.capturing .topbar,body.capturing .hints{display:none}
body.capturing .stage{border:none;border-radius:0;padding:0;min-height:100vh}
body.capturing .boardwrap{position:fixed;inset:0;display:block!important;border-radius:0;box-shadow:none;background:#000}
body.capturing #displayCanvas{max-width:100vw!important;max-height:100vh!important;width:auto!important;height:auto!important;border-radius:0}
body.capturing #selBox{box-shadow:0 0 0 9999px rgba(4,6,14,.62)}
/* ===== Tauri 长截图浮动控制条态（主窗缩为小条，须置于 capturing 规则之后） ===== */
body.longmode{overflow:hidden}
body.longmode .boardwrap{display:none!important}
body.longmode .stage,body.longmode .app{min-height:0!important}
body.longmode #longBar{left:0;right:0;top:0;bottom:0;transform:none;border-radius:0;justify-content:center;padding:0 12px;gap:10px;background:rgba(10,13,22,.92)}
body.longmode #toast{bottom:auto;top:6px}
</style>
</head>
<body>
<div class="bg"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div></div>
<div class="gridbg"></div>

<div class="app">
  <!-- 顶栏 -->
  <header class="topbar" data-tauri-drag-region>
    <div class="logo">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 8V5.5A2.5 2.5 0 0 1 5.5 3H8M16 3h2.5A2.5 2.5 0 0 1 21 5.5V8M21 16v2.5A2.5 2.5 0 0 1 18.5 21H16M8 21H5.5A2.5 2.5 0 0 1 3 18.5V16"/>
        <circle cx="12" cy="12" r="3.1"/>
      </svg>
    </div>
    <div class="brand">
      <h1>SnapStudio · 截图标注工作台</h1>
      <p>捕获屏幕 · 精准框选 · 十种标注 · 一键复制</p>
    </div>
    <div class="spacer"></div>
    <div class="pill" id="statusPill"><span class="dot" id="statusDot"></span><span id="statusText">待机中</span></div>
    <div class="pill" style="gap:7px;padding:6px 10px">
      <span style="color:var(--dim);font-size:12px">延时</span>
      <select id="delaySel" class="fsel" style="padding:2px 4px;max-width:64px">
        <option value="0">关</option><option value="3">3 秒</option><option value="5">5 秒</option><option value="10">10 秒</option>
      </select>
    </div>
    <div class="pill" style="gap:7px;padding:6px 10px">
      <span style="color:var(--dim);font-size:12px">范围</span>
      <select id="scopeSel" class="fsel" style="padding:2px 4px;max-width:104px">
        <option value="screen">当前屏幕</option>
        <option value="all">所有显示器</option>
        <option value="window">前台窗口</option>
      </select>
    </div>
    <button class="btn ghost hidden" id="btnShareState" style="border-color:rgba(61,220,151,.55);color:#3ddc97" title="屏幕共享进行中：按 Alt+A 直接截屏，点此停止共享">共享中</button>
    <button class="btn primary" id="btnCapture">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V5.5A2.5 2.5 0 0 1 5.5 3H8M16 3h2.5A2.5 2.5 0 0 1 21 5.5V8M21 16v2.5A2.5 2.5 0 0 1 18.5 21H16M8 21H5.5A2.5 2.5 0 0 1 3 18.5V16"/></svg>
      开始捕获
    </button>
    <button class="btn ghost" id="btnUpload">打开图片</button>
    <input type="file" id="fileInput" accept="image/*" class="hidden">
  </header>

  <!-- 舞台 -->
  <section class="stage" id="stage">
    <div class="empty" id="empty">
      <div class="halo">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="url(#g1)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a48bff"/><stop offset="1" stop-color="#4de3ff"/></linearGradient></defs>

<script>
(function () {
  'use strict';
  var IS_TAURI = !!(window.__TAURI__ && window.__TAURI__.core);

  // ============ DOM ============
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage'), emptyEl = $('empty'), board = $('board');
  var canvas = $('displayCanvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });
  var annCanvas = $('annCanvas'), actx = annCanvas.getContext('2d');
  var overlay = null;
  var selBox = $('selBox'), sizeBadge = $('sizeBadge');
  var toolbar = $('toolbar'), swatches = $('swatches'), widths = $('widths');
  var textInput = $('textInput');
  var mag = null, magCtx = null, magTip = null;

  // ============ 状态 ============
  var S = {
    img: null,            // 底图 (Image / VideoFrame -> canvas)
    sel: null,            // {x,y,w,h} 源图像素坐标
    tool: 'rect',
    color: '#ff3b5c',
    width: 4,
    fontFamily: "'PingFang SC','Microsoft YaHei',sans-serif",
    fontSize: 24,
    bold: false,
    history: [[]],        // 命令快照数组
    redoStack: [],
    preview: null,        // 绘制中的临时图形
    drag: null,
    badge: 0,
    dragMode: null,       // 'select' | 'annotate' | 'moveSel'
    selectedIdx: -1,      // 当前选中的标注（用于编辑/删除）
    capture: null,        // 最近一次截屏的 Shot（含 x/y 物理原点），用于长截图换算物理坐标
    long: null            // 长截图会话 { region, cx, cy, acc, frames, busy, auto, stall }
  };

  var COLORS = ['#ff3b5c', '#ff8a3d', '#ffd23d', '#31d99c', '#22d3ee', '#5b8cff', '#a877ff', '#ffffff', '#111318'];
  var WIDTHS = [2, 4, 6, 9];

  // ============ 工具函数 ============
  function toast(msg) {
    var t = $('toast');
    $('toastText').textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove('show'); }, 1900);
  }
  function setStatus(txt, live) {
    $('statusText').textContent = txt;
    $('statusDot').className = 'dot' + (live ? ' live' : '');
  }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function copyText(t) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t); return; }
    } catch (e) {}
    try {
      var ta = document.createElement('textarea');
      ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e2) {}
      document.body.removeChild(ta);
    } catch (e3) {}
  }
  function distToSeg(px, py, x1, y1, x2, y2) {
    var dx = x2 - x1, dy = y2 - y1;
    var l2 = dx * dx + dy * dy;
    if (!l2) return Math.hypot(px - x1, py - y1);
    var t = ((px - x1) * dx + (py - y1) * dy) / l2;
    t = clamp(t, 0, 1);
    return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
  }

  // ============ 初始化色板 / 笔宽 ============
  COLORS.forEach(function (c) {
    var b = document.createElement('button');
    b.className = 'sw' + (c === S.color ? ' on' : '');
    b.style.background = c;
    if (c === '#ffffff') b.style.boxShadow = 'inset 0 0 0 1px rgba(0,0,0,.25)';
    b.dataset.color = c;
    b.addEventListener('click', function () {
      S.color = c;
      Array.prototype.forEach.call(swatches.children, function (n) { n.classList.remove('on'); });
      b.classList.add('on');
      if (textInput.style.display === 'block') textInput.style.color = c;
      if (S.selectedIdx >= 0) {
        var cm = S.history[S.history.length - 1][S.selectedIdx];
        if (cm && cm.type !== 'mosaic') { cm.color = c; repaint(); }
      }
    });
    swatches.appendChild(b);
  });
  WIDTHS.forEach(function (w, i) {
    var b = document.createElement('button');
    b.className = 'wbtn' + (i === 1 ? ' on' : '');
    b.dataset.w = w;
    var d = Math.min(14, 3 + w * 1.15);
    b.innerHTML = '<i style="width:' + d + 'px;height:' + d + 'px"></i>';
    b.addEventListener('click', function () {
      S.width = w;
      Array.prototype.forEach.call(widths.children, function (n) { n.classList.remove('on'); });
      b.classList.add('on');
    });
    widths.appendChild(b);
  });

  // 文字样式控制
  $('fontSel').addEventListener('change', function () { S.fontFamily = this.value; });
  $('sizeSel').addEventListener('change', function () { S.fontSize = parseInt(this.value, 10) || 24; });
  $('btnBold').addEventListener('click', function () {
    S.bold = !S.bold;
    this.classList.toggle('on', S.bold);
  });

  // 工具切换
  Array.prototype.forEach.call(document.querySelectorAll('.tool[data-tool]'), function (btn) {
    btn.addEventListener('click', function () { selectTool(btn.dataset.tool); });
  });
  function selectTool(t) {
    S.tool = t;
    Array.prototype.forEach.call(document.querySelectorAll('.tool[data-tool]'), function (b) {
      b.classList.toggle('on', b.dataset.tool === t);
    });
    commitTextInput();
    hideMag();
  }
  selectTool('rect');

  // ============ 底图加载 ============
  function fitCanvas() {
    if (!canvas.width) return;
    // 触发 CSS 尺寸重算
    canvas.style.maxHeight = window.innerHeight < 700 ? '56vh' : '70vh';
  }
  window.addEventListener('resize', function () { fitCanvas(); syncOverlay(); });

  function loadImage(img) {
    var natural = { w: img.naturalWidth || img.width, h: img.naturalHeight || img.height };
    if (!natural.w) { toast('图片读取失败'); return; }
    canvas.width = natural.w;
    canvas.height = natural.h;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0);
    S.img = canvas;                 // 底图即 canvas 本身
    emptyEl.classList.add('hidden');
    board.style.display = 'block';
    resetSelection();
    fitCanvas();
    setStatus('已载入 ' + natural.w + '×' + natural.h, true);
    requestAnimationFrame(syncOverlay);
  }

  // 屏幕捕获 —— 「一次共享，之后即截」（类企业微信体验）：
  // 首次截屏须经浏览器共享选择器（浏览器安全硬性要求，任何网页无法跳过）；
  // 共享流会话内保持存活并缓存，之后截屏 / Alt+A 直接抓当前画面，不再弹窗。
  var SHARED_STREAM = null, SHARED_VIDEO = null, SHARE_N = 0;

  function isTauriEnv() { return !!(window.__tauri__ && window.__tauri__.core); }

  function shareLive() {
    try {
      var ts = SHARED_STREAM && SHARED_STREAM.getVideoTracks();
      return !!(ts && ts.length && ts[0].readyState === 'live');
    } catch (_) { return false; }
  }

  function updateShareBadge() {
    var b = document.getElementById('btnShareState');
    if (!b || isTauriEnv()) return;
    if (shareLive()) {
      b.classList.remove('hidden');
      b.textContent = '共享中 · Alt+A 即截 (' + SHARE_N + ') · 停止';
    } else {
      b.classList.add('hidden');
    }
  }

  function stopShare(manual) {
    if (SHARED_STREAM) {
      try { SHARED_STREAM.getTracks().forEach(function (t) { t.stop(); }); } catch (_) {}
    }
    SHARED_STREAM = null; SHARED_VIDEO = null; SHARE_N = 0;
    updateShareBadge();
    if (manual) toast('已停止屏幕共享，下次截屏将重新选择共享内容');
  }

  function grabFrameFromVideo(v, reuse) {
    var w = v.videoWidth, h = v.videoHeight;
    var tmp = document.createElement('img');
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(v, 0, 0, w, h);
    tmp.onload = function () {
      loadImage(tmp);
      toast(reuse ? '直接截屏（无需共享）· 拖拽框选目标区域' : '捕获成功，拖拽框选目标区域');
    };
    tmp.onerror = function () { toast('画面冻结失败'); };
    tmp.src = c.toDataURL('image/png');
  }

  function captureScreen() { if (IS_TAURI) { startTauriCapture(); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
      toast('当前环境不支持屏幕捕获，请用「打开图片」');
      return;
    }
    // 已共享：直接抓当前画面
    if (shareLive()) {
      SHARE_N++;
      updateShareBadge();
      grabFrameFromVideo(SHARED_VIDEO, true);
      return;
    }
    setStatus('请求捕获权限…', false);
    navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: 30, cursor: 'never' },
      audio: false
    }).then(function (stream) {
      SHARED_STREAM = stream;
      SHARE_N = 1;
      var video = document.createElement('video');
      video.srcObject = stream;
      video.muted = true;
      video.playsInline = true;
      // 用户点浏览器「停止共享」条时同步清理状态
      var trk = stream.getVideoTracks()[0];
      if (trk) trk.addEventListener('ended', function () { stopShare(false); });
      return video.play().then(function () {
        return new Promise(function (res) { setTimeout(function () { res(video); }, 260); });
      }).then(function (v) {
        SHARED_VIDEO = v;
        updateShareBadge();
        setStatus('已载入', true);
        grabFrameFromVideo(v, false);
      });
    }).catch(function (err) {
      console.warn(err);
      setStatus('待机中', false);
      if (String(err && err.name) === 'NotAllowedError') toast('已取消捕获');
      else toast('捕获失败：可改用「打开图片」');
    });
  }

  function readFile(f) {
    if (!f || !/^image\//.test(f.type)) { toast('请选择图片文件'); return; }
    var url = URL.createObjectURL(f);
    var img = new Image();
    img.onload = function () { loadImage(img); URL.revokeObjectURL(url); };
    img.onerror = function () { toast('图片解码失败'); };
    img.src = url;
  }

  // ============ 选区 ============
  function resetSelection() {
    S.sel = null;
    S.history = [[]];
    S.redoStack = [];
    S.preview = null;
    S.movePreview = null;
    S.selectedIdx = -1;
    S.badge = 0;
    annCanvas.width = annCanvas.height = 0;
    annCanvas.style.display = 'none';
    selBox.style.display = 'none';
    toolbar.style.display = 'none';
    textInput.style.display = 'none';
    hideSelBar();
  }

  function buildOverlay() {
    overlay = document.createElement('div');
    overlay.id = 'overlay';
    board.insertBefore(overlay, annCanvas);
    overlay.addEventListener('pointerdown', onDown);
    overlay.addEventListener('pointermove', onMove);
    overlay.addEventListener('pointerup', onUp);
    overlay.addEventListener('pointercancel', onUp);
    overlay.addEventListener('dblclick', function () { if (S.sel) doCopy(); });

    // 放大镜
    mag = document.createElement('div');
    mag.id = 'mag';
    var mc = document.createElement('canvas');
    mc.width = mc.height = 252;
    mag.appendChild(mc);
    magCtx = mc.getContext('2d');
    magCtx.imageSmoothingEnabled = false;
    magTip = document.createElement('div');
    magTip.id = 'magTip';
    mag.appendChild(magTip);
    board.appendChild(mag);
  }

  function ratio() {
    var r = canvas.getBoundingClientRect();
    return canvas.width ? r.width / canvas.width : 1;
  }
  function toImage(e) {
    var r = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) / r.width * canvas.width,
      y: (e.clientY - r.top) / r.height * canvas.height
    };
  }

  function syncOverlay() {
    if (!S.sel) return;
    var k = ratio();
    var b = board.getBoundingClientRect();
    var r = canvas.getBoundingClientRect();
    var offX = r.left - b.left, offY = r.top - b.top;
    var s = S.sel;
    selBox.style.display = 'block';
    selBox.style.left = (offX + s.x * k) + 'px';
    selBox.style.top = (offY + s.y * k) + 'px';
    selBox.style.width = (s.w * k) + 'px';
    selBox.style.height = (s.h * k) + 'px';
    sizeBadge.textContent = Math.round(s.w) + ' × ' + Math.round(s.h);
    if (annCanvas.width) {
      annCanvas.style.display = 'block';
      annCanvas.style.left = (offX + s.x * k) + 'px';
      annCanvas.style.top = (offY + s.y * k) + 'px';
      annCanvas.style.width = (s.w * k) + 'px';
      annCanvas.style.height = (s.h * k) + 'px';
    }
    placeToolbar();
  }

  function placeToolbar() {
    if (!S.sel) { toolbar.style.display = 'none'; return; }
    var k = ratio();
    var b = board.getBoundingClientRect();
    var r = canvas.getBoundingClientRect();
    var offX = r.left - b.left, offY = r.top - b.top;
    var s = S.sel;
    toolbar.style.display = 'flex';
    var tw = toolbar.offsetWidth, th = toolbar.offsetHeight;
    var bw = b.width, bh = b.height;
    var cx = offX + (s.x + s.w / 2) * k;
    var below = offY + (s.y + s.h) * k + 14;
    var above = offY + s.y * k - th - 14;
    var top = (below + th > bh - 4) ? Math.max(4, above) : below;
    var left = clamp(cx - tw / 2, 4, Math.max(4, bw - tw - 4));
    toolbar.style.left = left + 'px';
    toolbar.style.top = top + 'px';
  }

  // 放大镜
  function showMag(p) {
    if (!S.img) return;
    var k = ratio();
    var b = board.getBoundingClientRect();
    var r = canvas.getBoundingClientRect();
    mag.style.display = 'block';
    var mx = r.left - b.left + p.x * k, my = r.top - b.top + p.y * k;
    var half = mag.offsetWidth / 2 || 63;
    var left = clamp(mx - half, 0, b.width - half * 2);
    var top = my - half - 74;
    if (top < 0) top = my + 74;
    top = clamp(top, 0, b.height - half * 2);
    mag.style.left = left + 'px';
    mag.style.top = top + 'px';
    var c = magCtx.canvas, size = c.width;
    var zoom = 5, srcSpan = size / zoom;
    magCtx.fillStyle = '#000';
    magCtx.fillRect(0, 0, size, size);
    magCtx.drawImage(canvas, p.x - srcSpan / 2, p.y - srcSpan / 2, srcSpan, srcSpan, 0, 0, size, size);
    // 准星
    magCtx.strokeStyle = 'rgba(255,255,255,.85)';
    magCtx.lineWidth = 1;
    magCtx.beginPath();
    magCtx.moveTo(size / 2, size / 2 - 16); magCtx.lineTo(size / 2, size / 2 + 16);
    magCtx.moveTo(size / 2 - 16, size / 2); magCtx.lineTo(size / 2 + 16, size / 2);
    magCtx.stroke();
    magTip.textContent = Math.round(p.x) + ',' + Math.round(p.y);
  }
  function hideMag() { if (mag) mag.style.display = 'none'; }

  // ============ 指针交互 ============
  function onDown(e) {
    if (!S.img) return;
    var p = toImage(e);
    // 取色器：吸取画面任意点颜色（HEX 复制）
    if (S.tool === 'picker') {
      var px = clamp(Math.round(p.x), 0, canvas.width - 1), py = clamp(Math.round(p.y), 0, canvas.height - 1);
      var d = ctx.getImageData(px, py, 1, 1).data;
      var hex = '#' + [d[0], d[1], d[2]].map(function (v) { return ('0' + v.toString(16)).slice(-2); }).join('');
      S.color = hex;
      Array.prototype.forEach.call(swatches.children, function (n) { n.classList.toggle('on', n.dataset.color === hex); });
      copyText(hex);
      toast('已取色 ' + hex.toUpperCase() + ' · 已复制');
      selectTool('rect');
      return;
    }
    overlay.setPointerCapture(e.pointerId);
    commitTextInput();

    var s = S.sel;
    if (s && p.x >= s.x && p.x <= s.x + s.w && p.y >= s.y && p.y <= s.y + s.h) {
      // 先判断是否点中已有标注 -> 进入编辑（拖动/删除）
      var hit = hitTest(p.x, p.y);
      if (hit >= 0) {
        S.selectedIdx = hit;
        S.dragMode = 'moveSel';
        S.drag = { x0: p.x, y0: p.y, moved: false, cmdBase: clone(S.history[S.history.length - 1][hit]) };
        repaint();
        showSelBar();
        return;
      }
      S.selectedIdx = -1;
      hideSelBar();
      S.dragMode = 'annotate';
      startAnnotate(p, e);
      return;
    }
    // 选区外 -> 重新框选
    S.dragMode = 'select';
    if (s) { resetSelection(); }
    S.drag = { x0: clamp(p.x, 0, canvas.width), y0: clamp(p.y, 0, canvas.height), x1: p.x, y1: p.y };
    selBox.style.display = 'block';
    annCanvas.style.display = 'none';
    updateSelFromDrag();
    showMag(p);
  }

  function updateSelFromDrag() {
    var d = S.drag, k = ratio();
    var r = canvas.getBoundingClientRect(), b = board.getBoundingClientRect();
    var offX = r.left - b.left, offY = r.top - b.top;
    var x0 = clamp(d.x0, 0, canvas.width), y0 = clamp(d.y0, 0, canvas.height);
    var x1 = clamp(d.x1, 0, canvas.width), y1 = clamp(d.y1, 0, canvas.height);
    var x = Math.min(x0, x1), y = Math.min(y0, y1);
    var w = Math.abs(x1 - x0), h = Math.abs(y1 - y0);
    selBox.style.left = (offX + x * k) + 'px';
    selBox.style.top = (offY + y * k) + 'px';
    selBox.style.width = (w * k) + 'px';
    selBox.style.height = (h * k) + 'px';
    sizeBadge.textContent = Math.round(w) + ' × ' + Math.round(h);
    S.sel = { x: x, y: y, w: w, h: h };
  }

  function onMove(e) {
    if (!S.img) return;
    var p = toImage(e);
    if (S.dragMode === 'select' && S.drag) {
      if (e.shiftKey) {
        var dx = p.x - S.drag.x0, dy = p.y - S.drag.y0;
        var m = Math.max(Math.abs(dx), Math.abs(dy));
        p = { x: S.drag.x0 + Math.sign(dx) * m, y: S.drag.y0 + Math.sign(dy) * m };
      }
      S.drag.x1 = p.x; S.drag.y1 = p.y;
      updateSelFromDrag();
      showMag(p);
    } else if (S.dragMode === 'annotate') {
      moveAnnotate(p, e);
    } else if (S.dragMode === 'moveSel' && S.drag && S.selectedIdx >= 0) {
      var dx = p.x - S.drag.x0, dy = p.y - S.drag.y0;
      if (dx || dy) {
        S.drag.moved = true;
        var mc = clone(S.drag.cmdBase);
        applyDelta(mc, S.drag.cmdBase, dx, dy);
        S.movePreview = mc;
        repaint();
        showSelBar();
      }
    } else {
      overlay.style.cursor = (S.sel && insideSel(p)) ? (S.tool === 'text' ? 'text' : 'crosshair') : 'crosshair';
    }
  }
  function insideSel(p) {
    var s = S.sel;
    return s && p.x >= s.x && p.x <= s.x + s.w && p.y >= s.y && p.y <= s.y + s.h;
  }

  function onUp(e) {
    if (S.dragMode === 'select' && S.drag) {
      finalizeSelection();
    } else if (S.dragMode === 'annotate') {
      endAnnotate();
    } else if (S.dragMode === 'moveSel' && S.selectedIdx >= 0) {
      if (S.movePreview && S.drag && S.drag.moved) {
        var arr = S.history[S.history.length - 1].slice();
        arr[S.selectedIdx] = S.movePreview;
        S.history.push(arr);
        S.redoStack = [];
        toast('已移动标注');
      }
      S.movePreview = null;
      repaint();
      showSelBar();
    }
    S.dragMode = null;
    S.drag = null;
  }

  function finalizeSelection() {
    hideMag();
    var s = S.sel;
    if (!s || s.w < 6 || s.h < 6) {
      resetSelection();
      toast('选区太小，请重新框选');
      return false;
    }
    annCanvas.width = Math.max(1, Math.round(s.w));
    annCanvas.height = Math.max(1, Math.round(s.h));
    actx.setTransform(1, 0, 0, 1, 0, 0);
    actx.clearRect(0, 0, annCanvas.width, annCanvas.height);
    actx.translate(-s.x, -s.y);
    S.history = [[]];
    S.redoStack = [];
    S.badge = 0;
    syncOverlay();
    requestAnimationFrame(function () { placeToolbar(); syncOverlay(); });
    setStatus('已选中 ' + Math.round(s.w) + '×' + Math.round(s.h), true);
    return true;
  }

  // ============ 标注绘制 ============
  var textStart = null;

  function snapshot() { return clone(S.history[S.history.length - 1]); }
  function pushCmd(c) {
    var arr = snapshot();
    arr.push(c);
    S.history.push(arr);
    S.redoStack = [];
    repaint();
  }

  function repaint() {
    if (!annCanvas.width) return;
    actx.setTransform(1, 0, 0, 1, 0, 0);
    actx.clearRect(0, 0, annCanvas.width, annCanvas.height);
    actx.translate(-S.sel.x, -S.sel.y);
    var cmds = S.history[S.history.length - 1];
    for (var i = 0; i < cmds.length; i++) drawCmd(actx, cmds[i]);
    if (S.preview) drawCmd(actx, S.preview);
    if (S.movePreview) drawCmd(actx, S.movePreview);
    // 选中高亮框
    var selCmd = S.movePreview || (S.selectedIdx >= 0 ? cmds[S.selectedIdx] : null);
    if (selCmd) {
      var bb = cmdBBox(selCmd);
      actx.save();
      actx.strokeStyle = 'rgba(124,92,255,.95)';
      actx.lineWidth = 1.4;
      actx.setLineDash([6, 4]);
      actx.strokeRect(bb.x - 4, bb.y - 4, bb.w + 8, bb.h + 8);
      actx.restore();
    }
    annCanvas.style.display = 'block';
  }

  function drawCmd(pc, c) {
    pc.save();
    pc.lineCap = 'round';
    pc.lineJoin = 'round';
    switch (c.type) {
      case 'rect':
        pc.strokeStyle = c.color; pc.lineWidth = c.width;
        pc.strokeRect(c.x, c.y, c.w, c.h);
        break;
      case 'ellipse':
        pc.strokeStyle = c.color; pc.lineWidth = c.width;
        pc.beginPath();
        pc.ellipse(c.x + c.w / 2, c.y + c.h / 2, Math.abs(c.w / 2), Math.abs(c.h / 2), 0, 0, Math.PI * 2);
        pc.stroke();
        break;
      case 'line':
        pc.strokeStyle = c.color; pc.lineWidth = c.width;
        pc.beginPath(); pc.moveTo(c.x1, c.y1); pc.lineTo(c.x2, c.y2); pc.stroke();
        break;
      case 'arrow': {
        var ang = Math.atan2(c.y2 - c.y1, c.x2 - c.x1);
        var head = Math.max(12, c.width * 4.2);
        pc.strokeStyle = c.color; pc.lineWidth = c.width;
        pc.beginPath();
        pc.moveTo(c.x1, c.y1);
        pc.lineTo(c.x2 - Math.cos(ang) * head * .82, c.y2 - Math.sin(ang) * head * .82);
        pc.stroke();
        pc.fillStyle = c.color;
        pc.beginPath();
        pc.moveTo(c.x2, c.y2);
        pc.lineTo(c.x2 - Math.cos(ang - .42) * head, c.y2 - Math.sin(ang - .42) * head);
        pc.lineTo(c.x2 - Math.cos(ang + .42) * head, c.y2 - Math.sin(ang + .42) * head);
        pc.closePath();
        pc.fill();
        break;
      }
      case 'pen':
        if (!c.pts || c.pts.length < 2) break;
        pc.strokeStyle = c.color; pc.lineWidth = c.width;
        pc.beginPath();
        pc.moveTo(c.pts[0].x, c.pts[0].y);
        for (var i = 1; i < c.pts.length; i++) pc.lineTo(c.pts[i].x, c.pts[i].y);
        pc.stroke();
        break;
      case 'highlight':
        if (!c.pts || c.pts.length < 2) break;
        pc.globalAlpha = .38;
        pc.strokeStyle = c.color;
        pc.lineWidth = c.width * 4.6;
        pc.beginPath();
        pc.moveTo(c.pts[0].x, c.pts[0].y);
        for (var j = 1; j < c.pts.length; j++) pc.lineTo(c.pts[j].x, c.pts[j].y);
        pc.stroke();
        break;
      case 'mosaic':
        pc.fillStyle = '#888';
        for (var m = 0; m < c.cells.length; m++) {
          var cell = c.cells[m];
          pc.fillStyle = cell.c;
          pc.fillRect(cell.x, cell.y, c.block, cell.block);
        }
        break;
      case 'text':
        pc.fillStyle = c.color;
        pc.font = (c.bold ? '800 ' : '400 ') + c.size + 'px ' + (c.fontFamily || S.fontFamily);
        pc.textBaseline = 'top';
        pc.shadowColor = 'rgba(0,0,0,.45)';
        pc.shadowBlur = 6;
        pc.fillText(c.text, c.x, c.y);
        break;
      case 'badge': {
        var rr = c.r;
        pc.fillStyle = c.color;
        pc.beginPath(); pc.arc(c.x, c.y, rr, 0, Math.PI * 2); pc.fill();
        pc.strokeStyle = 'rgba(255,255,255,.9)'; pc.lineWidth = Math.max(1.5, rr * .09);
        pc.stroke();
        pc.fillStyle = '#fff';
        pc.font = '800 ' + (rr * 1.15) + 'px "PingFang SC",sans-serif';
        pc.textAlign = 'center';
        pc.textBaseline = 'middle';
        pc.fillText(String(c.n), c.x, c.y + rr * .04);
        break;
      }
    }
    pc.restore();
  }

  // ============ 标注命中检测 / 编辑 ============
  function cmdHit(c, x, y) {
    switch (c.type) {
      case 'rect': case 'ellipse': {
        var x1 = Math.min(c.x, c.x + c.w), x2 = Math.max(c.x, c.x + c.w);
        var y1 = Math.min(c.y, c.y + c.h), y2 = Math.max(c.y, c.y + c.h);
        return x >= x1 - 4 && x <= x2 + 4 && y >= y1 - 4 && y <= y2 + 4;
      }
      case 'line': case 'arrow':
        return distToSeg(x, y, c.x1, c.y1, c.x2, c.y2) < Math.max(8, (c.width || 4) + 6);
      case 'text': {
        var w = (c.text ? c.text.length : 1) * c.size * .62;
        return x >= c.x - 4 && x <= c.x + w + 4 && y >= c.y - 4 && y <= c.y + c.size + 4;
      }
      case 'badge':
        return Math.hypot(x - c.x, y - c.y) < c.r * 1.6;
      case 'pen': case 'highlight': {
        if (!c.pts) return false;
        for (var i = 0; i < c.pts.length; i++) if (Math.hypot(c.pts[i].x - x, c.pts[i].y - y) < 10) return true;
        return false;
      }
      case 'mosaic': {
        if (!c.cells) return false;
        for (var k = 0; k < c.cells.length; k++) { var cl = c.cells[k]; if (x >= cl.x && x <= cl.x + cl.block && y >= cl.y && y <= cl.y + cl.block) return true; }
        return false;
      }
    }
    return false;
  }
  function hitTest(x, y) {
    var cmds = S.history[S.history.length - 1];
    for (var i = cmds.length - 1; i >= 0; i--) if (cmdHit(cmds[i], x, y)) return i;
    return -1;
  }
  function cmdBBox(c) {
    if (c.type === 'line' || c.type === 'arrow') {
      return { x: Math.min(c.x1, c.x2), y: Math.min(c.y1, c.y2), w: Math.abs(c.x2 - c.x1), h: Math.abs(c.y2 - c.y1) };
    }
    if (c.type === 'pen' || c.type === 'highlight') {
      var xs = c.pts.map(function (q) { return q.x; }), ys = c.pts.map(function (q) { return q.y; });
      var minx = Math.min.apply(null, xs), miny = Math.min.apply(null, ys);
      return { x: minx, y: miny, w: Math.max.apply(null, xs) - minx, h: Math.max.apply(null, ys) - miny };
    }
    if (c.type === 'mosaic') {
      var mnx = 1e9, mny = 1e9, mxx = -1e9, mxy = -1e9;
      c.cells.forEach(function (o) { mnx = Math.min(mnx, o.x); mny = Math.min(mny, o.y); mxx = Math.max(mxx, o.x + o.block); mxy = Math.max(mxy, o.y + o.block); });
      return { x: mnx, y: mny, w: mxx - mnx, h: mxy - mny };
    }
    if (c.type === 'text') {
      return { x: c.x, y: c.y, w: (c.text ? c.text.length : 1) * c.size * 0.62, h: c.size * 1.2 };
    }
    if (c.type === 'badge') {
      return { x: c.x - c.r, y: c.y - c.r, w: c.r * 2, h: c.r * 2 };
    }
    return { x: c.x, y: c.y, w: c.w || 0, h: c.h || 0 };
  }
  function applyDelta(c, base, dx, dy) {
    ['x', 'y', 'x1', 'y1', 'x2', 'y2'].forEach(function (k) {
      if (base[k] != null) c[k] = base[k] + (k[0] === 'x' ? dx : dy);
    });
    if (base.pts) c.pts = base.pts.map(function (q) { return { x: q.x + dx, y: q.y + dy }; });
    if (base.cells) c.cells = base.cells.map(function (o) { return { x: o.x + dx, y: o.y + dy, block: o.block, c: o.c }; });
  }
  function deleteSelected() {
    if (S.selectedIdx < 0) return;
    var arr = S.history[S.history.length - 1].slice();
    arr.splice(S.selectedIdx, 1);
    S.history.push(arr);
    S.redoStack = [];
    S.selectedIdx = -1;
    hideSelBar();
    repaint();
    toast('已删除标注');
  }
  function showSelBar() {
    var bar = $('selBar');
    if (!bar || S.selectedIdx < 0) return;
    var cmds = S.history[S.history.length - 1];
    var c = S.movePreview || cmds[S.selectedIdx];
    if (!c) return;
    var bb = cmdBBox(c);
    var k = ratio();
    var b = board.getBoundingClientRect(), r = canvas.getBoundingClientRect();
    var offX = r.left - b.left, offY = r.top - b.top;
    bar.style.display = 'flex';
    var cx = offX + (bb.x + bb.w / 2 - S.sel.x) * k;
    var top = offY + (bb.y - S.sel.y) * k - 44;
    bar.style.left = clamp(cx - bar.offsetWidth / 2, 4, Math.max(4, b.width - bar.offsetWidth - 4)) + 'px';
    bar.style.top = Math.max(4, top) + 'px';
  }
  function hideSelBar() { var bar = $('selBar'); if (bar) bar.style.display = 'none'; }

  function startAnnotate(p, e) {
    var s = S.sel;
    var c = { type: S.tool, color: S.color, width: S.width };
    if (S.tool === 'rect' || S.tool === 'ellipse') {
      c.x = p.x; c.y = p.y; c.w = 0; c.h = 0;
    } else if (S.tool === 'arrow' || S.tool === 'line') {
      c.x1 = p.x; c.y1 = p.y; c.x2 = p.x; c.y2 = p.y;
    } else if (S.tool === 'pen' || S.tool === 'highlight') {
      c.pts = [{ x: p.x, y: p.y }];
    } else if (S.tool === 'mosaic') {
      c.block = Math.max(6, Math.round(S.width * 3.4));
      c.cells = [];
      c._seen = {};
      paintCell(c, p.x, p.y);
    } else if (S.tool === 'text') {
      openTextInput(p);
      S.dragMode = null;
      return;
    } else if (S.tool === 'badge') {
      S.badge += 1;
      c.n = S.badge;
      c.r = Math.max(12, S.width * 3.4);
      c.x = p.x + c.r; c.y = p.y + c.r;
      pushCmd(c);
      S.dragMode = null;
      return;
    }
    S.preview = c;
    repaint();
  }

  function moveAnnotate(p, e) {
    var c = S.preview;
    if (!c) return;
    if (c.type === 'rect' || c.type === 'ellipse') {
      if (e.shiftKey) {
        var dx = p.x - c.x, dy = p.y - c.y;
        var m = Math.max(Math.abs(dx), Math.abs(dy));
        c.w = Math.sign(dx || 1) * m; c.h = Math.sign(dy || 1) * m;
      } else { c.w = p.x - c.x; c.h = p.y - c.y; }
    } else if (c.type === 'arrow' || c.type === 'line') {
      c.x2 = p.x; c.y2 = p.y;
    } else if (c.type === 'pen' || c.type === 'highlight') {
      c.pts.push({ x: p.x, y: p.y });
    } else if (c.type === 'mosaic') {
      paintCell(c, p.x, p.y);
      if (!c.pts) c.pts = [];
      c.pts.push({ x: p.x, y: p.y });
    }
    repaint();
  }

  function paintCell(c, x, y) {
    var b = c.block;
    var bx = Math.floor(x / b) * b, by = Math.floor(y / b) * b;
    var key = bx + '_' + by;
    if (c._seen[key]) return;
    c._seen[key] = 1;
    var sx = clamp(bx, 0, canvas.width - 1), sy = clamp(by, 0, canvas.height - 1);
    var sw = Math.min(b, canvas.width - sx), sh = Math.min(b, canvas.height - sy);
    if (sw <= 0 || sh <= 0) return;
    var data;
    try { data = ctx.getImageData(sx, sy, sw, sh).data; } catch (err) { return; }
    var r = 0, g = 0, bl = 0, n = 0;
    for (var i = 0; i < data.length; i += 4) {
      r += data[i]; g += data[i + 1]; bl += data[i + 2]; n++;
    }
    if (!n) return;
    var col = 'rgb(' + Math.round(r / n) + ',' + Math.round(g / n) + ',' + Math.round(bl / n) + ')';
    c.cells.push({ x: bx, y: by, block: b, c: col });
  }

  function endAnnotate() {
    var c = S.preview;
    S.preview = null;
    if (!c) return;
    if (c.type === 'rect' || c.type === 'ellipse') {
      if (Math.abs(c.w) < 3 || Math.abs(c.h) < 3) { repaint(); return; }
    }
    if ((c.type === 'pen' || c.type === 'highlight') && c.pts.length < 2) { repaint(); return; }
    if (c.type === 'mosaic') { if (!c.cells.length) { repaint(); return; } delete c._seen; }
    if ((c.type === 'arrow' || c.type === 'line')) {
      var d = Math.hypot(c.x2 - c.x1, c.y2 - c.y1);
      if (d < 5) { repaint(); return; }
    }
    pushCmd(c);
  }

  // ============ 文字输入 ============
  function openTextInput(p) {
    var k = ratio();
    var s = S.sel;
    var size = S.fontSize;
    textInput.value = '';
    textInput.style.display = 'block';
    textInput.style.left = ((p.x - s.x) * k) + 'px';
    textInput.style.top = ((p.y - s.y) * k - size * k * .5) + 'px';
    textInput.style.fontSize = Math.max(13, size * k) + 'px';
    textInput.style.color = S.color;
    if (S.bold) { textInput.style.fontWeight = '800'; } else { textInput.style.fontWeight = '400'; }
    textInput.style.fontFamily = S.fontFamily;
    textInput.dataset.x = p.x;
    textInput.dataset.y = p.y;
    textInput.dataset.size = size;
    textInput.style.width = '120px';
    setTimeout(function () { textInput.focus(); }, 10);
  }
  function commitTextInput() {
    if (textInput.style.display !== 'block') return;
    var txt = textInput.value.trim();
    var px = parseFloat(textInput.dataset.x), py = parseFloat(textInput.dataset.y);
    textInput.style.display = 'none';
    textInput.value = '';
    if (!txt) return;
    pushCmd({
      type: 'text', text: txt, x: px, y: py,
      size: parseFloat(textInput.dataset.size), color: S.color,
      fontFamily: S.fontFamily, bold: S.bold
    });
  }
  textInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); commitTextInput(); }
    if (e.key === 'Escape') { textInput.style.display = 'none'; textInput.value = ''; e.stopPropagation(); }
  });
  textInput.addEventListener('blur', commitTextInput);

  // ============ 撤销 / 重做 ============
  function undo() {
    if (S.history.length <= 1) { toast('没有可撤销的操作'); return; }
    S.redoStack.push(S.history.pop());
    repaint();
  }
  function redo() {
    if (!S.redoStack.length) { toast('没有可重做的操作'); return; }

  $('btnUndo').addEventListener('click', undo);

  // ============ 导出 ============
  function compose() {
    var s = S.sel;
    var c = document.createElement('canvas');
    c.width = Math.round(s.w);
    c.height = Math.round(s.h);
    var g = c.getContext('2d');
    g.drawImage(canvas, s.x, s.y, s.w, s.h, 0, 0, c.width, c.height);
    if (annCanvas.width) {
      g.save();
      g.translate(-s.x, -s.y);
      var cmds = S.history[S.history.length - 1];
      for (var i = 0; i < cmds.length; i++) drawCmd(g, cmds[i]);
      g.restore();
    }
    return c;
  }
  function toBlob(c) {
    return new Promise(function (res) { c.toBlob(function (b) { res(b); }, 'image/png'); });
  }
  function doCopy() { if (IS_TAURI) { tauriExport('copy'); return; }
    if (!S.sel) { toast('请先框选区域'); return; }
    var c = compose();
    toBlob(c).then(function (blob) {
      if (!blob) { toast('生成失败'); return; }
      if (navigator.clipboard && window.ClipboardItem) {
        return navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
          .then(function () { toast('已复制到剪贴板 · ' + c.width + '×' + c.height); })
          .catch(function () { fallbackDownload(blob); });
      }
      fallbackDownload(blob);
    });
  }
  function fallbackDownload(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name || ('snap-' + Date.now() + '.png');
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    toast('已保存到下载文件夹：' + a.download);
  }
  function doSave() { if (IS_TAURI) { tauriExport('save'); return; }
    if (!S.sel) { toast('请先框选区域'); return; }
    var c = compose();
    toBlob(c).then(function (blob) { if (blob) fallbackDownload(blob); });
  }
  function doSaveFolder() {
    if (!S.sel) { toast('请先框选区域'); return; }
    var c = compose();
    var ts = new Date();
    var pad = function (n) { return ('0' + n).slice(-2); };
    var name = 'SnapStudio_' + ts.getFullYear() + pad(ts.getMonth() + 1) + pad(ts.getDate()) + '_'
      + pad(ts.getHours()) + pad(ts.getMinutes()) + pad(ts.getSeconds()) + '.png';
    toBlob(c).then(function (blob) {

            .then(function (path) { toast('已保存到 ' + path); })

  $('btnCopy').addEventListener('click', doCopy);

  // ============ 滚动长截图（桌面版） ============
  function isTauri() {
    return typeof window.__tauri__ !== 'undefined' && !!window.__tauri__.captureRegion;
  }

  // 基于 ImageData 的滚动量检测：内容下滚 s 像素时 fr[y]==acc[y+s]，新增内容为 fr 末尾 appendH 行。
  // acc/fr: {data:Uint8ClampedArray, w, h}（RGBA）。返回 {scroll, appendH} 或 null（无滚动/画面剧变）。
  function findScrollOffset(acc, fr) {
    var aw = acc.w, ah = acc.h, fw = fr.w, fh = fr.h;
    if (aw !== fw || ah === 0 || fh === 0) return null;
    var maxOverlap = Math.min(ah, fh);
    var minOverlap = Math.max(16, Math.round(fh * 0.12));
    if (maxOverlap <= minOverlap) return { scroll: ah, appendH: fh };
    var rowStep = Math.max(1, Math.round(fh / 200));
    var colStep = Math.max(1, Math.round(aw / 120));
    var best = null;
    for (var L = maxOverlap; L >= minOverlap; L -= rowStep) {
      var s = ah - L, diff = 0, cnt = 0;
      for (var y = 0; y < L; y += rowStep) {
        var ayBase = (s + y) * aw, fyBase = y * fw;
        for (var x = 0; x < aw; x += colStep) {
          var ai = (ayBase + x) * 4, fi = (fyBase + x) * 4;
          diff += Math.abs(acc.data[ai] - fr.data[fi])
                + Math.abs(acc.data[ai + 1] - fr.data[fi + 1])
                + Math.abs(acc.data[ai + 2] - fr.data[fi + 2]);
          cnt++;
        }
      }
      var score = cnt ? diff / cnt : 1e9;
      if (!best || score < best.score) best = { score: score, scroll: s, appendH: fh - L };
      if (score < 3) break;
    }
    if (best && best.score < 14) return { scroll: best.scroll, appendH: best.appendH };
    return null;
  }

  function startLongCapture() {
    if (!S.sel) { toast('请先框选要长截图的区域'); return; }
    if (!isTauri()) { toast('滚动长截图为桌面版功能（网页版暂不支持）'); return; }
    var cap = S.capture || { x: 0, y: 0 };
    var region = {
      x: Math.round(cap.x + S.sel.x),
      y: Math.round(cap.y + S.sel.y),
      w: Math.round(S.sel.w),
      h: Math.round(S.sel.h)
    };
    S.long = {
      region: region,
      cx: region.x + Math.round(region.w / 2),   // 区域中心（物理坐标），自动滚动落点
      cy: region.y + Math.round(region.h / 2),
      acc: null, frames: 0, busy: false, auto: false, stall: 0
    };
    toolbar.style.display = 'none';
    hideSelBar();
    selBox.style.display = 'none';
    // 主窗缩小为底部浮动控制条，露出目标窗口（容器 pointer-events:none，滚轮穿透）
    document.body.classList.add('longmode');
    if (window.__tauri__ && window.__tauri__.enterLongMode) {
      window.__tauri__.enterLongMode(820, 64, S.long.cx, S.long.cy).catch(function () {});
    }
    updateLongBar();
    $('longBar').classList.remove('hidden');
    toast('长截图就绪：点「自动滚动」全自动捕获，也可手动滚动后点「捕获下一屏」');
    captureNextFrame();
  }

  function captureNextFrame() {
    if (!S.long || S.long.busy) return;
    S.long.busy = true;
    var r = S.long.region;
    window.__tauri__.captureRegion(r.x, r.y, r.w, r.h).then(function (shot) {
      var img = new Image();
      img.onload = function () { S.long.busy = false; appendFrame(img); };
      img.onerror = function () {
        S.long.busy = false;
        if (S.long && S.long.auto) { scheduleAutoStep(); } else { toast('帧加载失败'); }
      };
      img.src = shot.dataUrl;
    }).catch(function (e) {
      S.long.busy = false;
      if (S.long && S.long.auto) { stopAutoScroll(true); toast('自动捕获失败：' + e); }
      else { toast('捕获失败：' + e); }
    });
  }

  function appendFrame(img) {
    var L = S.long;
    if (!L) return;
    if (!L.acc) {
      var c0 = document.createElement('canvas');
      c0.width = img.width; c0.height = img.height;
      c0.getContext('2d').drawImage(img, 0, 0);
      L.acc = c0; L.frames = 1;
      updateLongBar();
      if (L.auto) scheduleAutoStep();
      return;
    }
    var acc = L.acc;
    if (img.width !== acc.width) { toast('画面宽度变化，拼接结束'); finishLongCapture(); return; }
    var accData = acc.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, acc.width, acc.height).data;
    var frC = document.createElement('canvas');
    frC.width = img.width; frC.height = img.height;
    var frCtx = frC.getContext('2d', { willReadFrequently: true });
    frCtx.drawImage(img, 0, 0);
    var frData = frCtx.getImageData(0, 0, img.width, img.height).data;
    var res = findScrollOffset(
      { data: accData, w: acc.width, h: acc.height },
      { data: frData, w: img.width, h: img.height }
    );
    if (!res || res.appendH <= 0) {
      if (L.auto) {
        // 连续两帧无新内容才判定到底（单帧可能是滚动未稳定）
        L.stall++;
        if (L.stall >= 2) { toast('已到达内容底部，拼接结束'); finishLongCapture(); return; }
        updateLongBar();
        scheduleAutoStep();
        return;
      }
      toast('未检测到新内容，拼接结束'); finishLongCapture(); return;
    }
    var appendH = res.appendH;
    var out = document.createElement('canvas');
    out.width = acc.width; out.height = acc.height + appendH;
    var octx = out.getContext('2d');
    octx.drawImage(acc, 0, 0);
    octx.drawImage(img, 0, img.height - appendH, img.width, appendH, 0, acc.height, img.width, appendH);
    L.acc = out; L.frames++; L.stall = 0;
    updateLongBar();
    if (L.frames >= 40) { toast('已达最大帧数（40），拼接结束'); finishLongCapture(); return; }
    if (L.auto) scheduleAutoStep();
  }

  // ---------- 自动滚动（原生滚轮/翻页键 + 自动捕获循环） ----------
  function longSpeed() {
    var el = $('longSpeed');
    var v = el ? parseInt(el.value, 10) : 3;
    return (v === 2 || v === 3 || v === 5) ? v : 3;
  }

  function scheduleAutoStep() {
    var L = S.long;
    if (!L || !L.auto) return;
    var sp = longSpeed();
    var wait = sp >= 5 ? 300 : (sp >= 3 ? 450 : 700);
    setTimeout(autoStep, wait);
  }

  function autoStep() {
    var L = S.long;
    if (!L || !L.auto || L.busy) return;
    // 1) 向区域中心发送一次滚动（光标落到目标窗口上，滚轮直达）
    window.__tauri__.scrollAt(L.cx, L.cy, longSpeed()).then(function () {
      if (!S.long || !S.long.auto) return;
      // 2) 等滚动动画稳定后抓一帧并拼接
      setTimeout(function () {
        if (S.long && S.long.auto) captureNextFrame();
      }, 220);
    }).catch(function (e) {
      stopAutoScroll(true);
      toast('自动滚动不可用（' + e + '），请手动滚动目标窗口后点「捕获下一屏」');
    });
  }

  function startAutoScroll() {
    var L = S.long;
    if (!L) return;
    if (L.auto) { stopAutoScroll(); return; }
    L.auto = true; L.stall = 0;
    $('longAuto').textContent = '暂停自动';
    toast('自动长截图开始：请保持目标窗口不动，光标会自动滚动');
    autoStep();
  }

  function stopAutoScroll(silent) {
    var L = S.long;
    if (L) L.auto = false;
    try {
      if (window.__tauri__ && window.__tauri__.endAutoScroll) {
        window.__tauri__.endAutoScroll().catch(function () {});
      }
    } catch (e) {}
    var b = $('longAuto');
    if (b) b.textContent = '自动滚动';
    if (!silent) toast('已暂停自动滚动');
  }

  function updateLongBar() {
    var L = S.long;
    if (!L) return;
    var info = '长截图 · 已捕获 ' + L.frames + ' 帧 · 累计 '
      + (L.acc ? L.acc.width : 0) + '×' + (L.acc ? L.acc.height : 0);
    if (L.auto) info += ' · 自动中';
    $('longInfo').textContent = info;
  }

  // 退出长截图浮动控制条：恢复标注工具栏，并（桌面版）复位主窗口
  function leaveLongMode() {
    document.body.classList.remove('longmode');
    toolbar.style.display = '';
    if (typeof exitCaptureMode === 'function') {
      exitCaptureMode();   // 桥接层注入：复位窗口尺寸并退出全屏态
    } else if (window.__tauri__ && window.__tauri__.resetWindow) {
      window.__tauri__.resetWindow().catch(function () {});
    }
  }

  function finishLongCapture() {
    var L = S.long;
    if (L && L.auto) stopAutoScroll(true);
    hideLongBar();
    S.long = null;
    leaveLongMode();
    if (L && L.acc) {
      var acc = L.acc, frames = L.frames;
      loadImage(acc);
      toast('长截图完成：' + acc.width + '×' + acc.height + '（' + frames + ' 帧）');
    } else {
      setStatus('待机中', false);
    }
  }

  function cancelLongCapture() {
    var L = S.long;
    if (L && L.auto) stopAutoScroll(true);
    hideLongBar();
    S.long = null;
    leaveLongMode();
    toast('已取消长截图');
    setStatus('待机中', false);
  }

  function hideLongBar() { $('longBar').classList.add('hidden'); }

  $('btnLong').addEventListener('click', startLongCapture);

  // ============ 顶部按钮 ============

  function pasteFromClipboard(btn) {
    if (!navigator.clipboard || !navigator.clipboard.read) {
      toast('当前环境不支持读取剪贴板');
      return;
    }
    navigator.clipboard.read().then(function (items) {
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        for (var j = 0; j < it.types.length; j++) {
          if (/^image\//.test(it.types[j])) {
            return it.getType(it.types[j]).then(function (blob) {
              var url = URL.createObjectURL(blob);
              var img = new Image();
              img.onload = function () { loadImage(img); URL.revokeObjectURL(url); };

            });

      }
      toast('剪贴板里没有图片');

  // 全局粘贴
  window.addEventListener('paste', function (e) {
    var items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (var i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image') === 0) {
        var f = items[i].getAsFile();
        if (f) { readFile(f); e.preventDefault(); }

  // ============ 快捷键 ============
  var TOOL_KEYS = ['rect', 'ellipse', 'arrow', 'line', 'pen', 'highlight', 'mosaic', 'text', 'badge'];
  window.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' && e.target !== textInput) return;
    var mod = e.ctrlKey || e.metaKey;
    // Alt+A：共享会话内直接截屏（类企业微信）；桌面版有原生热键，不走此分支
    if (e.altKey && !mod && !e.shiftKey && (e.key === 'a' || e.key === 'A') && !isTauriEnv()) {
      e.preventDefault();
      if (document.activeElement && document.activeElement === textInput) return;
      if (shareLive()) { captureScreen(); }
      else { toast('尚未共享屏幕：点「开始捕获」选择一次共享后，Alt+A 即可随时截屏'); }
      return;
    }
    if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
    if (mod && e.key.toLowerCase() === 'c') { e.preventDefault(); doCopy(); return; }
    if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); doSave(); return; }
    if (e.key === 'Escape') {
      if (S.long) { cancelLongCapture(); return; }
      if (!$('smartModal').classList.contains('hidden')) { hideSmart(); return; }
      if (textInput.style.display === 'block') { commitTextInput(); return; }
      if (IS_TAURI && document.body.classList.contains('capturing')) { exitCaptureMode(); return; }
      if (S.sel) { resetSelection(); setStatus('已取消选区', false); }
      return;
    }
    if (e.key === 'Delete' && S.selectedIdx >= 0 && S.sel) {
      e.preventDefault();
      deleteSelected();
      return;
    }
    if (e.key === 'Enter') { commitTextInput(); return; }
    if (!mod && /^[1-9]$/.test(e.key)) {
      var t = TOOL_KEYS[parseInt(e.key, 10) - 1];
      if (t) { selectTool(t); toast('工具：' + t); }
    }
  });

  // ============ 演示模式 ============
  function roundRect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }
  function runDemo() {

    g.fillText('月度增长趋势', 84, 254);
    g.fillStyle = 'rgba(255,255,255,.18)';
    g.font = '700 36px "Segoe UI",sans-serif';
    g.fillText('SnapStudio 演示底图', 60, 620);

    // canvas 可直接作为底图，同步完成
    loadImage(c);
    S.sel = { x: 120, y: 250, w: 640, h: 430 };

    // 预置两笔标注，直观展示效果
    pushCmd({ type: 'arrow', x1: 180, y1: 350, x2: 320, y2: 320, color: '#ff3b5c', width: 4 });
    S.badge = 1;
    pushCmd({ type: 'badge', x: 690, y: 300, n: 1, r: 15, color: '#5b8cff' });
    toast('演示模式：直接试试工具条上的标注功能');
  }
  $('btnDemo').addEventListener('click', runDemo);

  // ============ 启动 ============
  buildOverlay();
  setStatus('待机中', false);

  // URL 带 #demo 时自动进入演示
  if (location.hash.indexOf('demo') >= 0) setTimeout(runDemo, 120);

  // 若页面已经在 localhost 下，给出更友好的提示
  if (location.protocol === 'file:' && !navigator.mediaDevices) {
    setTimeout(function () { toast('提示：如需屏幕捕获，建议用 http 方式打开本页'); }, 900);
  }

  // ============ 智能工具（OCR / 扫码 / 二维码 / 翻译） ============
  var _loaded = {};
  function loadScript(src) {
    return new Promise(function (res, rej) {
      if (_loaded[src]) return res();
      var s = document.createElement('script');
      s.src = src; s.crossOrigin = 'anonymous';
      s.onload = function () { _loaded[src] = 1; res(); };
      s.onerror = function () { rej(new Error('资源加载失败')); };
      document.head.appendChild(s);
    });
  }
  function showSmart(title, bodyNode, footBtns) {
    $('smartTitle').textContent = title;
    var body = $('smartBody'); body.innerHTML = ''; if (bodyNode) body.appendChild(bodyNode);
    var foot = $('smartFoot'); foot.innerHTML = '';
    (footBtns || []).forEach(function (b) {
      var el = document.createElement('button');
      el.className = 'sbtn' + (b.primary ? ' primary' : '');
      el.textContent = b.label;
      el.addEventListener('click', function () { b.fn && b.fn(); });
      foot.appendChild(el);
    });
    $('smartModal').classList.remove('hidden');
  }
  function hideSmart() { $('smartModal').classList.add('hidden'); }
  $('smartClose').addEventListener('click', hideSmart);
  $('smartModal').addEventListener('click', function (e) { if (e.target === this) hideSmart(); });

  function spinNode(msg) { var d = document.createElement('div'); d.innerHTML = '<span class="spin"></span>' + msg; return d; }

  function doOCR() {
    if (!S.sel) { toast('请先框选区域'); return; }
    toast('正在加载 OCR 组件…');
    loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js')
      .then(function () {
        if (!window.Tesseract) { toast('OCR 组件加载失败'); return; }
        var c = compose();
        showSmart('OCR 文字识别', spinNode('初始化识别引擎…'), []);
        Tesseract.recognize(c, 'chi_sim+eng', {
          logger: function (m) {
            if (m && m.status === 'recognizing text') {
              $('smartBody').innerHTML = '';
              $('smartBody').appendChild(spinNode('识别中 ' + Math.round((m.progress || 0) * 100) + '%'));
            }
          }
        })
          .then(function (res) { showOCRResult((res.data.text || '').trim()); })
          .catch(function (e) { $('smartBody').innerHTML = '<div class="serr">识别失败：' + (e && e.message || e) + '</div>'; });
      })
      .catch(function () { toast('OCR 组件加载失败（需要联网）'); });
  }
  function showOCRResult(text) {
    var body = document.createElement('div');
    var ta = document.createElement('textarea'); ta.value = text || '(未识别到文字)';
    body.appendChild(ta);
    showSmart('OCR 文字识别', body, [
      { label: '复制文字', primary: true, fn: function () { copyText(ta.value); toast('已复制文字'); } },
      { label: '翻译', fn: function () { translateText(ta.value); } }
    ]);
  }
  function translateText(text) {
    text = (text || '').trim();
    if (!text) { toast('没有可翻译的文字'); return; }
    var hasZh = /[一-龥]/.test(text);
    var pair = hasZh ? 'zh|en' : 'en|zh';
    showSmart('翻译中…', spinNode('正在翻译…'), []);
    fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=' + pair)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var t = (d && d.responseData && d.responseData.translatedText) || (d && d.response) || '';
        if (!t) throw new Error('无翻译结果');
        var body = document.createElement('div');
        var ta = document.createElement('textarea'); ta.value = t; body.appendChild(ta);
        showSmart('翻译结果（' + (hasZh ? '中→英' : '英→中') + '）', body,
          [{ label: '复制译文', primary: true, fn: function () { copyText(ta.value); toast('已复制译文'); } }]);
      })
      .catch(function (e) { $('smartBody').innerHTML = '<div class="serr">翻译失败：' + (e && e.message || e) + '</div>'; });
  }
  function doScan() {
    if (!S.sel) { toast('先框选含二维码的区域'); return; }
    toast('正在加载扫码组件…');
    loadScript('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js')
      .then(function () {
        if (!window.jsQR) { toast('扫码组件加载失败'); return; }
        var c = compose();
        var g = c.getContext('2d');
        var img = g.getImageData(0, 0, c.width, c.height);
        var code = jsQR(img.data, c.width, c.height);
        if (code && code.data) {
          var body = document.createElement('div');
          var pre = document.createElement('div');
          pre.style.whiteSpace = 'pre-wrap'; pre.style.wordBreak = 'break-all'; pre.textContent = code.data;
          body.appendChild(pre);
          showSmart('扫码结果', body, [
            { label: '复制内容', primary: true, fn: function () { copyText(code.data); toast('已复制'); } },
            { label: '打开链接', fn: function () { if (/^https?:\/\//.test(code.data)) window.open(code.data, '_blank'); else toast('不是网址'); } }
          ]);
        } else {
          var empty = document.createElement('div');
          empty.textContent = '未识别到二维码，请框选更清晰的区域。';
          showSmart('扫码结果', empty, []);
        }
      })
      .catch(function () { toast('扫码组件加载失败（需要联网）'); });
  }
  function doGen() {
    toast('正在加载二维码组件…');
    loadScript('https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js')
      .then(function () {
        if (!window.QRCode) { toast('二维码组件加载失败'); return; }
        var body = document.createElement('div');
        var input = document.createElement('input');
        input.placeholder = '输入文字或网址，如 https://snap.studio';
        input.style.cssText = 'width:100%;padding:10px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--txt);outline:none;font-family:inherit;font-size:13px';
        var box = document.createElement('div'); box.className = 'qrbox'; box.style.marginTop = '12px';
        body.appendChild(input); body.appendChild(box);
        var foot = [
          { label: '生成', primary: true, fn: function () { box.innerHTML = ''; new QRCode(box, { text: input.value || 'https://snap.studio', width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M }); } },
          { label: '保存图片', fn: function () {
            var cv = box.querySelector('canvas');
            if (cv) { cv.toBlob(function (b) { fallbackDownload(b, 'qrcode.png'); }); }
            else { var im = box.querySelector('img'); if (im) { fetch(im.src).then(function (r) { return r.blob(); }).then(function (b) { fallbackDownload(b, 'qrcode.png'); }); } }
          } }
        ];
        showSmart('生成二维码', body, foot);
        new QRCode(box, { text: 'https://snap.studio', width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
      })
      .catch(function () { toast('二维码组件加载失败（需要联网）'); });
  }
  $('btnOCR').addEventListener('click', doOCR);
  $('btnScan').addEventListener('click', doScan);
  $('btnGen').addEventListener('click', doGen);

  // 录屏转 GIF
  function doGif() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
      toast('当前环境不支持录屏'); return;
    }
    toast('正在加载 GIF 组件…');
    loadScript('https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js')
      .then(function () {
        if (!window.GIF) { toast('GIF 组件加载失败'); return; }
        navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 10 }, audio: false })
          .then(function (stream) { startGifRecord(stream); })
          .catch(function () { toast('已取消录屏'); });
      })
      .catch(function () { toast('GIF 组件加载失败（需要联网）'); });
  }
  function startGifRecord(stream) {
    var video = document.createElement('video');
    video.srcObject = stream; video.muted = true; video.playsInline = true;
    video.play().then(function () {
      var vw = video.videoWidth, vh = video.videoHeight;
      if (!vw || !vh) { toast('录屏分辨率获取失败'); stream.getTracks().forEach(function (t) { t.stop(); }); return; }
      var scale = Math.min(1, 720 / vw);
      var w = Math.round(vw * scale), h = Math.round(vh * scale);
      var off = document.createElement('canvas'); off.width = w; off.height = h;
      var octx = off.getContext('2d');
      var gif = new GIF({ workers: 2, quality: 12, width: w, height: h, workerScript: 'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js' });
      var fps = 10, frameMs = 1000 / fps, maxMs = 15000, start = performance.now(), last = 0, raf = 0, done = false;
      showSmart('录屏中…', spinNode('准备录制…'), [{ label: '停止并生成', primary: true, fn: stop }]);
      function stop() {
        if (done) return;
        done = true; cancelAnimationFrame(raf);
        stream.getTracks().forEach(function (t) { t.stop(); });
        $('smartBody').innerHTML = ''; $('smartBody').appendChild(spinNode('正在合成 GIF…'));
      }
      function tick() {
        if (done) return;
        var now = performance.now();
        if (now - last >= frameMs) {
          last = now;
          octx.drawImage(video, 0, 0, w, h);
          gif.addFrame(octx, { copy: true, delay: frameMs });
        }
        var el = (now - start) / 1000;
        $('smartBody').innerHTML = ''; $('smartBody').appendChild(spinNode('录制中 ' + el.toFixed(1) + 's（最长 15s，点“停止并生成”）'));
        if (now - start >= maxMs) { stop(); return; }
        raf = requestAnimationFrame(tick);
      }
      raf = requestAnimationFrame(tick);
      gif.on('progress', function (p) {
        $('smartBody').innerHTML = ''; $('smartBody').appendChild(spinNode('生成 GIF 中 ' + Math.round(p * 100) + '%'));
      });
      gif.on('finished', function (blob) {
        var body = document.createElement('div');
        body.textContent = 'GIF 已生成（' + Math.round(blob.size / 1024) + ' KB），可保存到下载文件夹。';
        showSmart('GIF 已生成', body, [
          { label: '保存到下载文件夹', primary: true, fn: function () { fallbackDownload(blob, 'snap-record.gif'); } },
          { label: '重新录制', fn: function () { hideSmart(); doGif(); } }
        ]);
      });
      gif.render();
    }).catch(function () { toast('录屏启动失败'); stream.getTracks().forEach(function (t) { t.stop(); }); });
  }
  $('btnGif').addEventListener('click', doGif);

  // 钉图：把当前选区钉到桌面（仅桌面端可用；网页端提示）
  function doPin() {
    if (!S.sel) { toast('请先框选区域'); return; }
    if (typeof window.__tauri__ !== 'undefined' && window.__tauri__.pinImage) {
      var c = compose();
      toBlob(c).then(function (blob) {
        blob.arrayBuffer().then(function (buf) {
          window.__tauri__.pinImage(Array.from(new Uint8Array(buf)))
            .then(function (label) { toast('已钉到桌面：' + label + '（拖动移动 · 双击关闭）'); })
            .catch(function (e) { toast('钉图失败：' + e); });
        });
      });
    } else {
      toast('钉图是桌面端专属功能（当前为网页版）');
    }
  }
  $('btnPin').addEventListener('click', doPin);


  // ============ Tauri 原生桥接 ============
  var T = IS_TAURI ? window.__TAURI__ : null;

  function startTauriCapture() {
    var scope = 'screen';
    var sel = document.getElementById('scopeSel');
    if (sel) scope = sel.value || 'screen';
    var cmd = scope === 'all' ? 'grab_all_screens' : (scope === 'window' ? 'grab_window' : 'grab_screen');
    var label = scope === 'all' ? '全部显示器' : (scope === 'window' ? '前台窗口' : '屏幕');
    toast('正在捕获' + label + '…');
    T.core.invoke(cmd).catch(function (e) { toast('捕获失败：' + e); });
  }

  function enterCaptureMode(shot) {
    // 热键打断长截图：安静清理会话（不碰窗口几何，随后 Rust 会铺满覆盖层）
    if (S.long) {
      var wasAuto = S.long.auto;
      S.long = null;
      hideLongBar();
      document.body.classList.remove('longmode');
      toolbar.style.display = '';
      if (wasAuto) {
        try { window.__tauri__.endAutoScroll().catch(function () {}); } catch (e) {}
      }
    }
    document.body.classList.add('capturing');
    S.capture = shot;   // 记录物理原点，供长截图把选区换算成屏幕物理坐标
    var img = new Image();
    img.onload = function () {
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
      S.img = canvas;
      emptyEl.classList.add('hidden');
      board.style.display = 'block';
      canvas.style.maxWidth = '100vw';
      canvas.style.maxHeight = '100vh';
      resetSelection();
      setStatus('拖拽框选目标区域 · ' + shot.monitor, true);
      requestAnimationFrame(function () {
        try { T.window.getCurrentWindow().show(); T.window.getCurrentWindow().setFocus(); } catch (e) {}
      });
    };
    img.onerror = function () { toast('画面加载失败'); };
    img.src = shot.dataUrl;
  }

  function exitCaptureMode() {
    document.body.classList.remove('capturing');
    resetSelection();
    setStatus('待机中', false);
    // 用完即走：复位防重入标志 + 恢复几何并隐藏回托盘，不再弹出主窗
    try { T.core.invoke('finish_capture').catch(function(){}); } catch (e) {}
  }

  function tauriExport(action) {
    if (!S.sel) { toast('请先框选区域'); return; }
    var c = compose();
    var dataUrl = c.toDataURL('image/png');
    var b64 = (dataUrl.split(',')[1]) || '';
    toast('正在导出…');
    T.core.invoke('export_capture', { pngBase64: b64, action: action })
      .then(function () {
        if (action === 'copy') toast('已复制到剪贴板 · ' + c.width + '×' + c.height);
        else toast('已保存 PNG · ' + c.width + '×' + c.height);
        exitCaptureMode();
      })
      .catch(function (e) { toast('导出失败：' + e); });
  }

  if (IS_TAURI) {
    // 暴露原生专属能力给前端（网页版无此对象，自动回退）
    window.__tauri__ = {
      saveImageToFolder: function (bytes, name) {
        return T.core.invoke('save_image_to_folder', { bytes: bytes, name: name });
      },
      pinImage: function (bytes) {
        return T.core.invoke('pin_image', { bytes: bytes });
      },
      captureRegion: function (x, y, w, h) {
        return T.core.invoke('capture_region', { x: x, y: y, w: w, h: h });
      },
      enterLongMode: function (w, h, cx, cy) {
        return T.core.invoke('enter_long_mode', { w: w, h: h, cx: cx, cy: cy });
      },
      scrollAt: function (x, y, notches) {
        return T.core.invoke('scroll_at', { x: x, y: y, notches: notches });
      },
      endAutoScroll: function () {
        return T.core.invoke('end_auto_scroll');
      },
      resetWindow: function () {
        return T.core.invoke('reset_window');
      },
      setCaptureMode: function (mode) {
        return T.core.invoke('set_capture_mode', { mode: mode });
      }
    };

    // 「范围」选择器变化时同步截屏模式，供全局热键分流
    var scopeSelEl = document.getElementById('scopeSel');
    if (scopeSelEl) scopeSelEl.addEventListener('change', function () {
      T.core.invoke('set_capture_mode', { mode: this.value }).catch(function () {});
    });

    T.event.listen('snap:capture', function (ev) { enterCaptureMode(ev.payload); });
    setStatus('待机中 · 热键 Ctrl/⌘+Shift+A 截图', false);
    // 隐藏 Web 专属的“屏幕捕获”文案，桌面端用系统热键
    var capBtns = document.querySelectorAll('#btnCapture,#btnCapture2');
    Array.prototype.forEach.call(capBtns, function (b) { b.textContent = b.textContent.replace('捕获屏幕', '截屏 (热键)').replace('开始捕获', '截屏 (热键)'); });
  }

})();
